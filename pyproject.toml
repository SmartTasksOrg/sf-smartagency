[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartagency"
version = "0.1.1"
description = "Signed contracts that say what an AI agent may do, a ledger to suspend and revoke them, and a monitor that enforces them on every action, with SmartFabric pressure limits."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SmartTasks Lab" }]
keywords = ["ai-agents", "authorization", "contracts", "ed25519", "iaiso", "smartfabric", "audit"]
dependencies = [
    "sf-smartfabric>=0.5.1,<0.6",
    "cryptography>=42",
    "jsonschema>=4.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://smarttasks.cloud"
Source = "https://github.com/SmartTasksOrg/sf-smartagency"
Issues = "https://github.com/SmartTasksOrg/sf-smartagency/issues"
Security = "https://github.com/SmartTasksOrg/sf-smartagency/security/policy"
Changelog = "https://github.com/SmartTasksOrg/sf-smartagency/blob/main/CHANGELOG.md"

[project.scripts]
sf-smartagency = "sf_smartagency.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sf_smartagency = ["data/schema/*.json", "data/conformance/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
